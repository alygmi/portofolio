<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="aMainGrad" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="20" y1="30" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Subtle Inner Grid Accent Lines -->
  <path d="M14 16H50M14 48H50" stroke="#27272a" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Left & Right Pillars of Geometric 'A' -->
  <path
    d="M32 12L15 50H23.5L32 29.5L40.5 50H49L32 12Z"
    fill="url(#aMainGrad)"
  />

  <!-- Dynamic Code/Circuit Crossbar Slash -->
  <path
    d="M21 38.5L43 33.5L45.5 39.5L18.5 44.5L21 38.5Z"
    fill="url(#accentCyan)"
  />

  <!-- Top Apex Circuit Node -->
  <circle cx="32" cy="12" r="3" fill="#a7f3d0" />

  <!-- Bottom Right Terminal Prompt Dot Accent -->
  <circle cx="50" cy="15" r="2.5" fill="#38bdf8" />
</svg>
